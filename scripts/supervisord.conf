[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:postgresql]
command=/usr/lib/postgresql/15/bin/postgres -D /var/lib/postgresql/15/main
user=postgres
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/postgresql.log
stderr_logfile=/var/log/supervisor/postgresql_err.log
priority=10

[program:relayer]
command=/app/tesseract-relayer
directory=/app
environment=TESSERACT_CONFIG="/app/config/demo.toml",RUST_LOG="info,tesseract_relayer=debug"
autostart=true
autorestart=true
startsecs=10
stdout_logfile=/var/log/supervisor/relayer.log
stderr_logfile=/var/log/supervisor/relayer_err.log
priority=20

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/nginx.log
stderr_logfile=/var/log/supervisor/nginx_err.log
priority=30
