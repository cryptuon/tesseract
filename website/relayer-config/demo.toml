# Tesseract Relayer - Demo Configuration
# Uses public RPC endpoints (no API keys required)

[relayer]
instance_id = "tesseract-demo"
poll_interval_ms = 2000
max_concurrent_txs = 5
max_retries = 3
retry_delay_ms = 5000
health_check_interval_secs = 30

[database]
url = "postgres://tesseract:tesseract@postgres:5432/tesseract_relayer"
max_connections = 5
min_connections = 1

[api]
host = "0.0.0.0"
port = 8080

[metrics]
enabled = true
port = 9090

# Ethereum Sepolia - Primary demo chain
[chains.sepolia]
chain_id = 11155111
name = "Sepolia Testnet"
rpc_urls = [
    "https://rpc.sepolia.org",
    "https://ethereum-sepolia-rpc.publicnode.com",
    "https://1rpc.io/sepolia",
    "https://sepolia.gateway.tenderly.co"
]
ws_url = ""  # No WebSocket, use HTTP polling
contract_address = "${TESSERACT_BUFFER_ADDRESS}"
coordinator_address = "${COORDINATOR_ADDRESS}"
confirmation_blocks = 3  # Faster for demo
gas_price_strategy = "eip1559"
max_gas_price_gwei = 50
enabled = true

# Polygon Amoy Testnet
[chains.polygon_amoy]
chain_id = 80002
name = "Polygon Amoy"
rpc_urls = [
    "https://rpc-amoy.polygon.technology",
    "https://polygon-amoy-bor-rpc.publicnode.com"
]
